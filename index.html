<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild Quelle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            background-color: #f5f5f5;
        }

        .image-button {
            display: block;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            max-width: 992px;
            width: 100%;
        }

        .image-button img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <a href="https://www.google.com/preferences/source?q=https://www.bild.de/" class="image-button">
        <img src="bildquellebanner.png" alt="Bild Quelle Banner">
    </a>

    <script>
        function postHeight() {
            window.parent.postMessage(
                {
                    provider: "DAVIZ",
                    type: "embed-size",
                    height: document.body.clientHeight,
                },
                "*",
            );
        }

        const observer = new ResizeObserver(postHeight);
        observer.observe(document.body);
        postHeight();
    </script>
</body>
</html>
